[workspace]
members = ["ptts", "ptts-ffi"]
resolver = "3"

[workspace.package]
version = "0.4.1"
description = "Phonon text-to-speech inference and serving"
repository = "https://github.com/gradium-ai/xn-ptts"
keywords = ["tts", "text-to-speech", "speech-synthesis", "voice-cloning", "on-device"]
categories = ["multimedia::audio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ptts = { path = "ptts", version = "0.4.1" }

ebur128 = "0.1"
half = { version = "2.7.1", features = ["num-traits"] }
hf-hub = { version = "1.0", features = ["blocking"] }
rand = { version = "0.9.0", default-features = false }
rand_distr = "0.5.0"
rubato = "0.15.0"
safetensors = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.3", features = ["all"] }
thiserror = "2"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
xn = "0.2.11"

# Release builds stay lean; profiling adds debug information.
[profile.profiling]
inherits = "release"
debug = true
