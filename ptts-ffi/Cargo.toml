[package]
name = "ptts-ffi"
version.workspace = true
edition = "2024"
description = "CPU C interface to Phonon for the Android app"
repository.workspace = true
license.workspace = true

[lib]
# Android uses the shared library; retain library types for ABI consumers.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Text preparation, normalization and the tokenizer come from ptts, so both engines speak the
# same prompt the other frontends do.
ptts = { workspace = true, features = ["hf"] }
serde_json = { workspace = true }
