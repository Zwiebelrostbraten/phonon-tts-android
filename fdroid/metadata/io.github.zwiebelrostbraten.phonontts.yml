AntiFeatures:
  NonFreeAssets:
    en-US: Six optional 40M speech checkpoints use CC-BY-NC-4.0 and require Hugging
      Face approval. No models are bundled. The English 31M checkpoint and public
      voices use Apache-2.0.
Categories:
