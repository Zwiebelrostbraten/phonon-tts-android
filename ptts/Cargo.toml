[package]
name = "ptts"
version.workspace = true
edition = "2024"
autoexamples = false
autobins = false
readme = "README.md"
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
hf-hub = { workspace = true, optional = true }
xn = { workspace = true }
ebur128 = { workspace = true }
rand = { workspace = true, features = ["std_rng"] }
rand_distr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rubato = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
half = { workspace = true, optional = true }

[features]
default = []
# Downloads `hf://` checkpoints from the Hugging Face Hub in `Checkpoint::locate`.
hub = ["dep:hf-hub"]
cuda = ["xn/cuda", "dep:half"]
vulkan = ["xn/vulkan"]
metal = ["xn/metal", "dep:half"]
webgpu = ["xn/webgpu"]
accelerate = ["xn/accelerate"]
# Arm KleidiAI's SME2 kernels for the `q8_0` linears, on CPUs with SME2. A no-op elsewhere.
kai = ["xn/kai"]
# Hugging Face `tokenizers` support in `ptts::tok`.
hf = ["dep:tokenizers"]
# Decoding and resampling audio files (`ptts::audio`), for voice cloning.
audio = ["dep:symphonia", "dep:rubato"]
